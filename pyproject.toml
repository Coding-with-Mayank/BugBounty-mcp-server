[project]
name = "bugbounty-mcp-server"
version = "3.1.0"
description = "MCP server wrapping common bug-bounty recon/scanning tools, with authorization-scope enforcement, guidance engine, and a standalone CLI."
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
